<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pumpkin &amp; Halloween Map</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
  /* Fullscreen (see the toggle button's click handler) is requested on this
     wrapper, not #map directly - the Fullscreen API only shows the exact
     element asked for plus its children, so the region picker and legend
     (siblings of #map, not descendants) would otherwise vanish the moment
     fullscreen engages, since they'd be outside what's actually fullscreen.
     Needs its own position: relative so the region picker/legend, which
     position themselves absolutely, still anchor to the map area itself
     (not the page as a whole) once this becomes the fullscreened element. */
  #map-fullscreen-wrapper { position: relative; width: 100%; height: 100vh; }
  #map { height: 100vh; width: 100%; }
  #map-fullscreen-wrapper.pseudo-fullscreen { position: fixed; inset: 0; z-index: 9999; height: 100dvh; }
  #map-fullscreen-wrapper.pseudo-fullscreen #map { height: 100dvh; }
  .category-tag {
    display: block; font-size: 16px; font-weight: bold; text-transform: uppercase;
    letter-spacing: 0.03em; margin-bottom: 4px;
  }
  .popup-content { max-width: 240px; padding: 10px; }
  .popup-content img { width: 100%; border-radius: 4px; margin-bottom: 6px; display: block; }
  .popup-content h3 { margin: 0 0 4px 0; font-size: 15px; }
  .popup-content .field { margin: 4px 0; font-size: 13px; }
  .popup-content .label { font-weight: bold; }
  .hover-content { font-size: 13px; padding: 8px 10px; min-width: 140px; }
  .hover-content strong { display: block; font-size: 16px; margin-bottom: 3px; }
  .legend {
    background: #030719; color: #e5e8f5; padding: 8px 10px; border-radius: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5); font-size: 13px; line-height: 1.6;
    border: 1px solid #3555af;
  }
  .legend-dot {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }
  .custom-controls { display: flex; flex-direction: column; gap: 6px; margin: 10px; }
  .custom-map-btn {
    width: 32px; height: 32px; background: #030719; color: #e5e8f5;
    border: 1px solid #3555af; border-radius: 8px; font-size: 18px; line-height: 1;
    cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .custom-map-btn:hover { background: #12193a; }
  /* Google's InfoWindow adds its own generous padding by default - our own
     content divs above already control spacing, so strip Google's to avoid
     doubling up (this shows up most on the hover tooltip, which has little
     content and looked like a mostly-empty white box otherwise). */
  .gm-style .gm-style-iw-c { padding: 0 !important; }
  .gm-style .gm-style-iw-d { overflow: hidden !important; }

  .legend { position: absolute; bottom: 24px; right: 10px; z-index: 5; }
  .region-picker-wrap {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    background: #030719; color: #e5e8f5; padding: 8px 10px; border-radius: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5); border: 1px solid #3555af;
  }
  .region-picker-wrap select {
    font-size: 14px; padding: 4px; background: #030719; color: #e5e8f5;
    border: 1px solid #3555af; border-radius: 4px;
  }
  .region-picker-wrap select:focus {
    outline: 2px solid #959799; outline-offset: 1px;
  }
  .region-picker-wrap label { font-size: 12px; display: block; margin-bottom: 4px; }
  .region-picker-wrap .picker-row + .picker-row { margin-top: 6px; }
</style>
</head>
<body>
<div id="map-fullscreen-wrapper">
<div id="map"></div>
<div class="region-picker-wrap">
  <div class="picker-row">
    <label for="state-picker">State</label>
    <select id="state-picker"></select>
  </div>
  <div class="picker-row">
    <label for="region-picker">Region</label>
    <select id="region-picker"></select>
  </div>
</div>
<div class="legend" id="legend"></div>
</div>
<script>
const REGIONS = [{"name": "Puget Sound, WA", "slug": "puget_sound_wa", "intro": "From Whatcom County and the Fraser Valley down to Olympia, Puget Sound has the largest cluster of pumpkin patches on the map, most of them family farms. The biggest concentrations are in the Snohomish and Snoqualmie valleys (Snohomish, Duvall, Carnation, Fall City) and around Puyallup and Kent. Most farms that have posted 2026 dates open in mid-to-late September and run through October 31, and many add corn mazes, u-pick apples, or farm trains. For haunted houses, look to Buckley, Mountlake Terrace, and Stanwood, which mostly run Friday and Saturday nights in October.", "published": true}, {"name": "Central Washington, WA", "slug": "ellensburg_wa", "intro": "Covers orchard country along the east side of the Cascades: Wenatchee, Leavenworth, and Manson on Lake Chelan, plus Ellensburg and the Yakima Valley towns of Naches and Toppenish. Many listings are orchards and u-pick farms that add pumpkins in the fall. None had posted 2026 dates on their own websites when we last checked, so confirm with each farm before you go.", "published": true}, {"name": "Spokane & SE Washington, WA", "slug": "spokane_wa", "intro": "Covers Spokane and the farm country north of town (Mead, Colbert), west to Cheney and Medical Lake, plus Moses Lake, the Tri-Cities, and Walla Walla, and across the state line to Coeur d'Alene, Rathdrum, and Moscow. Most listings are u-pick farms, and several pair pumpkins with corn mazes, apple picking, or petting zoos. Most farms that have posted 2026 dates run from late September through the end of October; a few, like Palmer's Adventure Farm in Moses Lake and Middleton Farms in Pasco, stay open through November 1.", "published": true}, {"name": "Portland & Salem, OR", "slug": "portland_or", "intro": "This region covers the Portland metro area, Sauvie Island, and Hood River, south through the farm country around Gervais and St. Paul to Salem, plus the Washington side of the Columbia from Vancouver to Kelso. Many patches cluster southwest of Portland in Tualatin, Sherwood, and Wilsonville. Most farms that have posted 2026 dates open mid-to-late September and run through October 31. St. Helens hosts its Halloweentown celebration on select days from late September into November, and Tualatin's Giant Pumpkin Regatta is October 18, 2026.", "published": true}, {"name": "Willamette Valley, OR", "slug": "eugene_or", "intro": "Covers the southern Willamette Valley (Eugene, Springfield, Albany, Corvallis, and the farm towns between them like Harrisburg, Jefferson, Creswell, and Pleasant Hill), plus a few spots on the Oregon coast in Siletz and Coos Bay. Eugene and Springfield have the most choices. The farms here that have posted 2026 dates open around September 25 and run through the end of October, often with corn mazes, u-pick apples, and cider.", "published": true}, {"name": "Southern Oregon, OR", "slug": "medford_or", "intro": "Covers the Rogue Valley (Medford, Central Point, Ashland, and Grants Pass) plus Klamath Falls to the east. Medford has the most listings. Fort Vannoy Farms in Grants Pass runs its corn maze and pumpkin patch October 1\u201331, with a haunted corn maze on select October nights. Most other farms here hadn't posted 2026 dates when we last checked, so confirm before you go.", "published": true}, {"name": "Central Oregon, OR", "slug": "bend_or", "published": true, "intro": "Covers Bend, Redmond and Terrebonne. Smith Rock Ranch in Terrebonne has a big corn maze, pumpkin cannon and wagon rides with views of Smith Rock, open September 26 to October 31, 2026. Nearby DD Ranch has hayrides, a petting zoo and a play area Tuesday through Sunday. In Bend, Schilling's Garden Market runs its pumpkin patch through November 1 and Well Rooted Produce offers u-pick pumpkins until October 25."}, {"name": "Eastern Oregon, OR", "slug": "hermiston_or", "published": true, "intro": "Covers Hermiston, Pendleton, La Grande and Baker City. Echo Corn Maze & Pumpkin Patch, just off I-84 near Hermiston, has an 8-acre corn maze and pumpkin patch from September 25 to November 8, 2026. Night Fright Productions in Imbler near La Grande runs a haunted warehouse and escape rooms, and Val's Veggies in Baker City and Pick'N Patch in Cove offer pumpkins and fall produce."}, {"name": "North Coast, CA", "slug": "eureka_ca", "intro": "Covers Humboldt County on the far North Coast: Eureka, Arcata, Loleta, and Fortuna. It's a small group of family farms. Organic Matters Ranch in Eureka has posted 2026 dates (weekends, September 26 to October 31). Green Spiral Farm in Arcata is open through October. Table Bluff Farm and Fortuna Pumpkin Patch run weekend and weekday-afternoon hours.", "published": true}, {"name": "Redding & Chico, CA", "slug": "chico_ca", "intro": "Covers the upper Sacramento Valley, from Redding and Anderson south through Orland, Chico, and Biggs. Historic Hawes Farm in Anderson hosts the North California Pumpkin Festival from September 12 to November 1, 2026. Nash Ranch in Redding runs its patch through November 1, with The Dreams of Darkness haunt on the same property. Farther south are TJ Farms in Chico, Country Pumpkins in Orland, and Max's Miracle Ranch in Biggs.", "published": true}, {"name": "Sacramento & Gold Country, CA", "slug": "sacramento_ca", "intro": "Covers the Sacramento metro area and the farm country around it \u2014 Davis and Woodland to the west, Elk Grove and Wilton to the south, Loomis, Granite Bay, and Lincoln to the northeast \u2014 plus the foothill Gold Country, including Apple Hill near Placerville and Camino, a fall favorite for its orchards, bakeries, and pumpkin patches. Many farms that have posted 2026 dates open in late September and run through October 31, and a few, like Bishop's Pumpkin Farm in Wheatland, stay open into November. For haunted attractions, look to Sacramento, Rancho Cordova, and Davis, which mostly run select nights from early October into early November.", "published": true}, {"name": "North Bay, CA", "slug": "santa_rosa_ca", "intro": "Covers Sonoma and Marin counties \u2014 Santa Rosa, Petaluma, Forestville, Healdsburg, Glen Ellen, Novato, and Nicasio. Santa Rosa and Petaluma have the most pumpkin patches, and most farms that have posted 2026 dates run from late September through October 31, a few through November 1. Petaluma's corn maze is one of the bigger draws here, and Blind Scream in Santa Rosa runs haunted houses on select October nights.", "published": true}, {"name": "San Francisco Bay Area, CA", "slug": "san_francisco_ca", "intro": "Covers San Francisco, the Peninsula, and the East Bay, with the biggest cluster of pumpkin farms along the coast in Half Moon Bay. The Half Moon Bay Art and Pumpkin Festival is October 17\u201318, 2026. In the East Bay, Livermore has farm patches that run October 2\u201331, and Fremont, San Lorenzo, Burlingame, San Mateo, and Daly City have Pick of the Patch pumpkin lots. For haunted attractions, look to Fear Overload Scream Park in Newark and Pirates of Emerson in Pleasanton, plus several haunts in San Francisco.", "published": true}, {"name": "San Jose & South Bay, CA", "slug": "san_jose_ca", "intro": "Covers San Jose and the South Bay \u2014 Santa Clara, Saratoga, and Los Gatos \u2014 south to Morgan Hill and Hollister. San Jose has several pumpkin lots, including Pick of the Patch locations and the Moreland pumpkin patch (October 9\u201331, 2026). Farther south, Spina Farms in Morgan Hill runs September 17 through November 2, and Swank Farms in Hollister is open daily in October. For haunted attractions, Dead Time Dreams and Grimm's Hollow, a family-friendly haunt, both run in San Jose in October.", "published": true}, {"name": "Stockton & Modesto, CA", "slug": "stockton_ca", "intro": "Covers the northern San Joaquin Valley \u2014 Stockton, Lodi, Linden, Lathrop, Manteca, and Modesto \u2014 plus Brentwood and Patterson on the edges. Farms that have posted 2026 dates mostly open in late September or early October and run through October 31 or November 1, including Dell'Osso Family Farm in Lathrop, Dutch Hollow Farms in Modesto, and Fantozzi Farms' corn maze in Patterson.", "published": true}, {"name": "Fresno & Central Valley, CA", "slug": "fresno_central_valley_ca", "intro": "Covers the central San Joaquin Valley: Fresno, Clovis, Sanger, Reedley, Madera, Merced, and Chowchilla, south to Visalia and Lemoore, plus Oakhurst in the foothills. Vossler Farms in Visalia runs its corn maze and patch from September 26 to November 1, 2026. Hillcrest Tree Farm in Reedley opens weekends from October 3. For scares, Raisin Hell Ranch in Madera, Hobb's Grove in Sanger, and Ranch of Horror in Chowchilla run select October nights.", "published": true}, {"name": "Monterey & Santa Cruz, CA", "slug": "monterey_santa_cruz_ca", "intro": "Covers the Monterey Bay area: Santa Cruz, Watsonville, Felton, Hollister, Salinas, Monterey, and Carmel. Rodoni Farm on Highway 1 north of Santa Cruz is open daily from September 26 to October 31, 2026. Crystal Bay Farm in Watsonville runs from September 27. Swank Farms in Hollister hosts its fall festival through October. Roaring Camp in Felton and Haunted Harbor on Cannery Row in Monterey round out the list.", "published": true}, {"name": "San Luis Obispo & Santa Barbara, CA", "slug": "san_luis_obispo_santa_barbara_ca", "intro": "Covers the Central Coast, from Paso Robles, Templeton, and Atascadero through San Luis Obispo and Nipomo, south to Solvang, Santa Ynez, and Santa Barbara. Lane Farms in Santa Barbara and Nipomo Pumpkin Patch both run September 26 to October 31, 2026. Avila Valley Barn and Jack Creek Farms in Templeton are longtime fall favorites. For scares, The Haunt in Atascadero runs from September 25 to November 1, and Nightmare From Main Street in Paso Robles opens Friday and Saturday nights in October.", "published": true}, {"name": "Los Angeles, CA", "slug": "los_angeles_ca", "intro": "Covers Los Angeles County plus Ventura County and the Antelope Valley: Moorpark, Ojai, Santa Paula, the San Fernando Valley, Pasadena, Santa Clarita, Lancaster, and the South Bay. Underwood Family Farms in Moorpark holds its 29th annual Fall Harvest Festival from September 26 to October 31. Gilchrist Farm in Santa Clarita runs through November 1, 2026. Neighborhood patches like Mr. Bones in Culver City dot the city. For scares, DELUSION and Dark Harbor on the Queen Mary in Long Beach run select nights through Halloween.", "published": true}, {"name": "Orange County & Inland Empire, CA", "slug": "orange_county_inland_empire_ca", "intro": "Covers Orange County and the Inland Empire: Irvine, Anaheim, Santa Ana, Brea, and San Clemente, plus Riverside, Corona, Redlands, Rancho Cucamonga, and Temecula wine country. Tanaka Farms in Irvine runs its pumpkin patch from September 12 to November 1, 2026. The Wickerd Farm in Menifee and Live Oak Canyon Farm in Redlands are inland favorites, and Temecula has Peltzer Pumpkin Farm and Big Horse Corn Maze. The area is packed with haunts, including Nightmare Rising in Corona, The 17th Door in Buena Park, and Reichland Asylum in Riverside.", "published": true}, {"name": "San Diego, CA", "slug": "san_diego_ca", "intro": "Covers San Diego County: coastal Carlsbad, Oceanside, Encinitas, and Del Mar, inland El Cajon, Lakeside, Escondido, and Valley Center, and the mountain town of Julian. Pumpkin Palooza in Carlsbad runs September 12 to October 31, 2026. Oma's Family Farm in Lakeside opens September 26, and Julian Farm and Orchard runs from September 4 to November 15. For scares, try The Haunted Amusement Park in El Cajon or the Haunted Trail in Balboa Park.", "published": true}, {"name": "Phoenix, AZ", "slug": "phoenix_az", "intro": "Covers the Phoenix metro: Glendale, Peoria, Surprise, and Goodyear on the west side, Scottsdale and Phoenix in the middle, and Mesa, Gilbert, Chandler, and Queen Creek to the east. Tolmachoff Farms in Glendale and Schnepf Farms in Queen Creek both run October 1 to 31, 2026. Vertuccio Farms in Mesa opens October 2. The Desert Fall Festival in Surprise runs September 25 to November 1. For scares, Fear Farm, 13th Floor, and AZ Scream Park run select nights through Halloween.", "published": true}, {"name": "Tucson, AZ", "slug": "tucson_az", "intro": "Covers Tucson and southern Arizona: Marana, Tucson, and day-trip towns like Willcox and Patagonia. Marana Pumpkin Patch runs Thursdays through Sundays, October 3 to 31, 2026. Apple Annie's in Willcox has pick-your-own pumpkins through October 31. Patagonia's Fall Festival is October 10 and 11. For scares, Nightfall at Old Tucson and The SlaughterHouse run select nights through November 1.", "published": true}, {"name": "Flagstaff & Northern Arizona, AZ", "slug": "flagstaff_northern_arizona_az", "intro": "Covers Flagstaff and the Prescott area. Viola's Flower Garden in Flagstaff opens its pumpkin patch September 26 and stays open all of October. The Arboretum at Flagstaff hosts its Pumpkin Walk on October 24, 2026. Near Prescott, Mortimer Farms in Dewey holds its fall Pumpkin Fest with a corn maze.", "published": true}, {"name": "Las Vegas, NV", "slug": "las_vegas_nv", "intro": "Covers the Las Vegas Valley, including Henderson and the northwest valley, plus Logandale's Moapa Valley about an hour north. Gilcrease Orchard runs pick-your-own pumpkins from September 26 to October 31. Vegas Pumpkin Patch in Henderson and Seasonal Adventures run daily through October 31, 2026. Moapa Valley Corn Maze opens October 10. For scares, Universal Horror Unleashed, Asylum-Hotel Fear and Undeadmaze lead a long list of haunts.", "published": true}, {"name": "Reno & Northern Nevada, NV", "slug": "reno_lake_tahoe_nv", "intro": "Covers Reno, Sparks, Carson City and the farm towns around them: Gardnerville, Fallon and Smith Valley. Andelin Family Farm in Sparks opens September 19, and Ferrari Farms in Reno runs September 26 to November 1, 2026. Corley Ranches in Gardnerville and Renner Farm in Smith Valley both run through October 31. For scares, Dark Prison in Carson City runs September 25 to November 1.", "published": true}, {"name": "Boise & Treasure Valley, ID", "slug": "boise_id", "intro": "Covers Boise, Meridian, Nampa, Caldwell and Kuna. Lowe Family Farmstead in Kuna, one of Idaho's original big corn mazes, runs September 12 to October 31, 2026, as do Ten Mile Farms in Meridian and Shindig Farms in Nampa. Pumpkin Palooza in Meridian opens September 19, and Cherry Hill Farms in Caldwell holds its fall festival and corn maze from September 25. For scares, The Haunted World and Requiem Haunted House are both in Caldwell.", "published": true}, {"name": "Twin Falls & Magic Valley, ID", "slug": "twin_falls_id", "intro": "Covers Twin Falls, Hansen and Burley. Tubbs Berry Farm in Twin Falls runs a straw maze and pumpkin patch, and BlueRock Farm Market has its own patch nearby. Burley Straw Maze & Pumpkin Patch adds a haunted maze on Saturdays, and the Magic Valley Corn Maze & Haunted Forest in Hansen opens every October evening.", "published": true}, {"name": "Eastern Idaho, ID", "slug": "rexburg_id", "published": true, "intro": "Covers Idaho Falls, Rexburg, Rigby, Blackfoot and Pocatello. New Sweden Farms in Idaho Falls runs its corn maze and pumpkin patch from September 15 to October 30, 2026, and U-Pick Red Barn runs September 19 to October 31. Swore Farms in Pocatello and MazePlay in Firth have corn mazes. The area is known for haunts: The Haunted Mill in Teton, The Haunted River in Menan and Lost Souls in Shelley all run select nights through Halloween."}, {"name": "Salt Lake City & Ogden, UT", "slug": "salt_lake_city_ogden_ut", "intro": "Covers Salt Lake County, Davis County and the Ogden area, from Draper and Riverton up through Farmington, Layton and Ogden, plus Tooele and Morgan. Black Island Farms in Syracuse and Happy Pumpkin Corn Maze in West Haven run September 18 to October 31, 2026. Mabey's in South Jordan and Cross E Ranch in Salt Lake City open September 25. For scares, Fear Factory in Salt Lake City and Castle of Chaos in Midvale run select nights through November 1.", "published": true}, {"name": "Provo & Utah County, UT", "slug": "provo_utah_county_ut", "intro": "Covers Utah County from Lehi to Payson, plus Heber City, Nephi and Mt. Pleasant. Cornbelly's has two locations, Lehi and Spanish Fork. Glen Ray's Corn Maze in Spanish Fork runs September 18 to October 31, 2026, and Jaker's Jack-O-Lanterns in Springville opens September 26. Hee Haw Farms in Pleasant Grove stays open into November. For scares, The Field of Fright in Spanish Fork and Haunt on Main in Pleasant Grove run through Halloween.", "published": true}, {"name": "Logan & Cache Valley, UT", "slug": "logan_cache_valley_ut", "intro": "Covers Logan and the Cache Valley towns of Richmond, Smithfield, Hyde Park, Wellsville, Paradise and Benson. Cache Valley Straw Maze in Richmond has a you-pick patch and a haunted maze on Saturday nights. Gunnell Farm in Smithfield runs September 18 to October 30, 2026. Don't miss the North Logan Pumpkin Walk, a decades-old tradition of carved pumpkin displays, or Haunted Hollow at the American West Heritage Center in Wellsville.", "published": true}, {"name": "St. George, UT", "slug": "st_george_ut", "intro": "Covers St. George and Washington in southern Utah. Staheli Family Farm in Washington has over 40 acres of corn maze and pumpkin patch from September 18 to October 31, 2026, with its Field of Screams haunt after dark. In town, Fiesta Fright Haunted House opens September 26.", "published": true}, {"name": "Denver & Boulder, CO", "slug": "denver_boulder_co", "intro": "Covers the Denver metro and Boulder County, from Longmont and Erie down through Littleton and Castle Rock, plus Bennett and Byers to the east. Anderson Farms in Erie runs September 23 to October 31, 2026, with its Terror in the Corn haunt after dark. Cottonwood Farms and Rocky Mountain Pumpkin Ranch are Boulder County favorites, and Maize in the City in Thornton has a 20-acre corn maze. Chatfield Farms in Littleton hosts its Pumpkin Festival and corn maze. For scares, 13th Floor and The Ritual run through Halloween.", "published": true}, {"name": "Fort Collins & Northern Colorado, CO", "slug": "fort_collins_northern_colorado_co", "intro": "Covers Fort Collins, Loveland, Greeley and the farm towns of Weld County. Fritzler Farm Park in LaSalle runs September 19 to November 1, 2026, with Scream Acres after dark. The Bartels Farm and Something From the Farm in Fort Collins open late September. Miller Farms in Platteville lets visitors pick their own pumpkins and vegetables.", "published": true}, {"name": "Colorado Springs & Pueblo, CO", "slug": "colorado_springs_pueblo_co", "intro": "Covers Colorado Springs, Monument, Calhan, Pueblo and Ca\u00f1on City. Colorado Pumpkin Patch in Monument runs September 16 to October 31, 2026, and Longneck Pumpkin Farm opens September 26. Diana's Pumpkin Patch & Corn Maze in Ca\u00f1on City is one of Fremont County's oldest. For scares, Hellscream and The Fear Complex in Colorado Springs open September 25, and Manitou Springs hosts the quirky Emma Crawford Coffin Races festival.", "published": true}, {"name": "Grand Junction & Western Slope, CO", "slug": "grand_junction_western_slope_co", "intro": "Covers Grand Junction and Fruita. Studt's Pumpkin Patch & Corn Maze in Grand Junction has one of the Western Slope's biggest corn mazes and runs October 1 to 31, 2026. Moon Farm in Fruita opens September 26 with a haunted straw maze and a little kids' corn maze.", "published": true}, {"name": "Albuquerque & Santa Fe, NM", "slug": "albuquerque_santa_fe_nm", "intro": "Covers Albuquerque, Rio Rancho, Los Ranchos, Santa Fe and the East Mountains out to Moriarty. McCall's Pumpkin Patch in Moriarty, the state's largest, runs September 19 to October 31, 2026, with McCall's Haunted Farm on Friday and Saturday nights. Galloping Goat Pumpkin Patch in Rio Rancho is open October 1 to 31, and Big Jim Farms in Albuquerque has a free-admission patch. Near Santa Fe, El Rancho de las Golondrinas hosts fall harvest events, and Haunted Scarecrow in Albuquerque opens September 16.", "published": true}, {"name": "Las Cruces & Southern New Mexico, NM", "slug": "las_cruces_southern_new_mexico_nm", "intro": "Covers Las Cruces, the Mesilla Valley, Anthony, Sunland Park, La Luz near Alamogordo and Artesia. Mesilla Valley Maze runs October 3 to 25, 2026, and La Union Maze in Anthony is another local favorite. Heirloom Acres Corn Maze & Pumpkin Patch in Artesia is open October 3 to 31, and Nichols Ranch & Orchards in La Luz hosts its Apple Festival. For scares, Western Playland's Freaky Frights and The Asylum are in Sunland Park.", "published": true}, {"name": "Dallas-Fort Worth, TX", "slug": "dallas_fort_worth_tx", "intro": "Covers the Dallas\u2013Fort Worth Metroplex, from Denton, Frisco and McKinney down to Cleburne and Midlothian, plus Canton, Rockwall and Terrell to the east. Autumn at the Dallas Arboretum fills the gardens with pumpkins from September 19 to November 1, 2026. Hall's Pumpkin Farm in Grapevine, Blase Family Farm in Rockwall and Mainstay Farm in Cleburne are family favorites, and Yesterland Farm in Canton adds Spooktacular Nights. For scares, Thrillvania in Terrell, Dark Hour in Plano and Curse of Ra in Arlington run select nights through Halloween.", "published": true}, {"name": "Houston, TX", "slug": "houston_tx", "intro": "Covers greater Houston, from Tomball, Spring, Humble and Montgomery in the north to Alvin and Texas City in the south, plus Brookshire and Wallis to the west. Dewberry Farm in Brookshire runs its fall festival from September 12 to November 8, and Blessington Farms in Wallis is open weekends through November 22. Froberg's Farm in Alvin, P-6 Farms in Montgomery and Rosehill Pumpkins in Tomball are other top picks. For scares, 13th Floor, Phobia and REDRUM Fear Park run select nights into November.", "published": true}, {"name": "Austin & Hill Country, TX", "slug": "austin_hill_country_tx", "intro": "Covers Austin, Round Rock, Georgetown, Leander, Manor, Buda and Bastrop, plus the Hill Country out to Marble Falls, Fredericksburg and Johnson City, and up to Temple and West. Sweet Berry Farm in Marble Falls is one of the area's most popular fall farms, and Hill Country Pumpkins in Austin runs September 25 to October 31, 2026. Texas Pumpkin Fest in Leander opens October 10. For scares, House of Torment in Austin and Bat City Scaregrounds in Buda run select nights.", "published": true}, {"name": "San Antonio, TX", "slug": "san_antonio_tx", "intro": "Covers San Antonio and nearby towns including New Braunfels, Seguin, Bulverde, La Vernia, Devine and Hondo. Circle N Maze in La Vernia runs October 16 to November 1, 2026, and Devine Acres Farm hosts its fall countryfest from September 26. South Texas Maize in Hondo and Traders Village Corny Maze offer more corn mazes. For scares, Howl-O-Scream at SeaWorld runs select nights September 11 to November 1.", "published": true}, {"name": "El Paso, TX", "slug": "el_paso_tx", "intro": "Covers El Paso and Socorro. El Paso's Corn Maze & Pumpkin Patch in Socorro is the big fall farm, open Saturdays and Sundays in October. For scares, The Haunted Houses of Terror opens October 1, 2026, along with Forbidden Acres Haunted Outdoor Trail and Haunted Hollows.", "published": true}, {"name": "Lubbock & Amarillo, TX", "slug": "lubbock_amarillo_tx", "intro": "Covers Lubbock, Amarillo, Floydada and Plainview. At'l Do Farms in Lubbock runs its corn maze and pumpkin patch from September 12 to November 7, 2026, and Maxwell's Pumpkin Farm in Amarillo is open October 3 to November 1. Floydada, the Pumpkin Capital of Texas, has Assiter Punkin Ranch. For scares, Amarillo Scaregrounds runs Friday and Saturday nights in October.", "published": true}, {"name": "Billings & Eastern Montana, MT", "slug": "billings_eastern_montana_mt", "intro": "Covers Billing l and Powell Pumpkin Patch are classic Louisburg stops. On the Missouri side, Carolyn's Pumpkin Patch in Liberty and Pumpkin Valley in Lee's Summit are local favorites, and Acres of Madness and Hells Gate in Kansas City, Kansas are the big haunts.", "published": true}, {"name": "Omaha, NE", "slug": "omaha_ne", "intro": "Covers Omaha, Gretna, Papillion, Blair and Council Bluffs, Iowa, down to Nebraska City. Vala's Pumpkin Patch in Gretna is the region's giant, with a corn maze, hayrack rides and cider donuts from September 4 to November 1, 2026. Bellevue Berry & Pumpkin Ranch in Papillion and Skinny Bones in Blair are smaller family favorites, and Arbor Day Farm in Nebraska City has you-pick pumpkins. For scares, Scary Acres, Dungeon of the Damned and Bloodrush lead the Omaha haunt scene.", "published": true}, {"name": "Lincoln, NE", "slug": "lincoln_ne", "intro": "Covers Lincoln and the surrounding Lancaster County farms. Roca Berry Farm south of Lincoln, the county's oldest and largest pumpkin farm, is open September 12 to November 1, 2026. Pearson's Pumpkin Place in Eagle is great for active kids, Martin's Hillside Orchard in Ceresco has apples and pumpkins, and Eagle Hollow Scream Park brings the scares on fall weekends.", "published": true}, {"name": "Sioux Falls, SD", "slug": "sioux_falls_sd", "intro": "Covers Sioux Falls, Harrisburg, Brandon, Canton and out to Yankton and Brookings. Country Apple Orchard near Harrisburg has been a pumpkin-picking staple since the 1980s, Riverview Tree Farm in Canton hosts a pumpkin festival with train rides and a haunted trail, and Our Farm SD near Parker gives every visitor a free gourd. Sioux Falls Corn Maze in Brandon runs August 28 through the end of the season, and Twisted Nightmare and Terror 29 handle the scares.", "published": true}, {"name": "Rapid City & Black Hills, SD", "slug": "rapid_city_sd", "intro": "Covers Rapid City and the northern Black Hills. Lil' Harvester's Pumpkin Patch south of Rapid City is the city's function addCustomControls(map) {
  const wrap = document.createElement('div');
  wrap.className = 'custom-controls';

  function makeButton(label, title, onClick) {
    const btn = document.createElement('button');
    btn.className = 'custom-map-btn';
    btn.textContent = label;
    btn.title = title;
    btn.type = 'button';
    btn.addEventListener('click', onClick);
    return btn;
  }

  wrap.appendChild(makeButton('+', 'Zoom in', function() { map.setZoom(map.getZoom() + 1); }));
  wrap.appendChild(makeButton('−', 'Zoom out', function() { map.setZoom(map.getZoom() - 1); }));

  // Plain Unicode glyphs (like the +/- above) render inconsistently for
  // "expand" vs "compress" across phone keyboards/fonts, so this one button
  // uses a small inline SVG instead - it also lets the icon actually swap
  // to reflect fullscreen state, which text content would too (this just
  // avoids finding a pair of Unicode symbols that reliably look distinct
  // everywhere).
  const EXPAND_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>';
  const COMPRESS_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4V9H4M15 4V9H20M15 20V15H20M9 20V15H4"/></svg>';

  const fullscreenBtn = document.createElement('button');
  fullscreenBtn.className = 'custom-map-btn';
  fullscreenBtn.type = 'button';
  fullscreenBtn.innerHTML = EXPAND_ICON;
  fullscreenBtn.title = 'Toggle fullscreen';
  // iPhones have no Fullscreen API for anything but video, so there the
  // button falls back to a CSS "fill the screen" mode. Inside the Wix iframe
  // that could only fill the iframe, so it opens the map in its own tab
  // instead (?fs=1 makes that tab start in fill-the-screen mode).
  const el = document.getElementById('map-fullscreen-wrapper');
  const request = el.requestFullscreen || el.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  let pseudoFullscreen = false;
  function nativeFullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement;
  }
  function setPseudoFullscreen(on) {
    pseudoFullscreen = on;
    el.classList.toggle('pseudo-fullscreen', on);
    google.maps.event.trigger(map, 'resize');
    syncFullscreenState();
  }
  fullscreenBtn.addEventListener('click', function() {
    if (nativeFullscreenElement()) {
      exit.call(document);
    } else if (pseudoFullscreen) {
      setPseudoFullscreen(false);
    } else if (request) {
      request.call(el);
    } else if (window.self !== window.top) {
      const url = new URL(window.location.href);
      url.searchParams.set('fs', '1');
      window.open(url.toString(), '_blank');
    } else {
      setPseudoFullscreen(true);
    }
  });
  wrap.appendChild(fullscreenBtn);

  map.controls[google.maps.ControlPosition.RIGHT_TOP].push(wrap);

  // One-finger dragging is only what you want full-screen, where the map is
  // the whole screen and there's nothing else to scroll past - otherwise it'd
  // hijack a normal one-finger page scroll on mobile. Listening for the
  // fullscreen change (rather than only reacting to our own button above)
  // also covers leaving fullscreen via Esc or a phone's back gesture - which
  // is also why the icon/title swap below lives in this same listener
  // instead of the click handler: that's the only way it stays correct
  // when fullscreen is exited some other way.
  function syncFullscreenState() {
    const isFullscreen = !!nativeFullscreenElement() || pseudoFullscreen;
    map.setOptions({ gestureHandling: isFullscreen ? 'greedy' : 'cooperative' });
    fullscreenBtn.innerHTML = isFullscreen ? COMPRESS_ICON : EXPAND_ICON;
    fullscreenBtn.title = isFullscreen ? 'Exit fullscreen' : 'Toggle fullscreen';
  }
  document.addEventListener('fullscreenchange', syncFullscreenState);
  document.addEventListener('webkitfullscreenchange', syncFullscreenState);
  if (new URLSearchParams(window.location.search).get('fs') === '1') setPseudoFullscreen(true);
}

// Google shows its own "Use two fingers to move the map" overlay when a
// one-finger drag hits cooperative gesture handling (outside fullscreen) -
// there's no official option to change that text, so this looks for it and
// swaps in a hint about fullscreen instead, which is the actual way to get
// one-finger scrolling on this map. A first attempt watched only for new DOM
// nodes appearing (MutationObserver on childList), which didn't catch the
// real thing on an actual phone - Google most likely shows/hides one
// pre-existing element rather than creating a fresh one each time, which a
// childList-only watch would never see. Polling instead of watching at all
// caught it, but only every 400ms, so Google's own wording was visible
// for a moment before the swap - noticeable, since it's shown at exactly
// the moment someone's looking right at it. A MutationObserver configured
// broadly enough this time (attributes and text changes too, not just new
// nodes) reacts before the next paint, which is what actually gets rid of
// that flash - scoped to the map element itself, not the whole page, since
// that's where Google's own controls (and this hint) live, and coalesced
// through requestAnimationFrame so a burst of unrelated map-internal
// mutations (tile loading during a pan, for instance) triggers one scan
// instead of dozens.
function redirectGestureHintToFullscreen() {
  // The replacement text below still contains "two fingers" on purpose (see
  // the actual wording), so a naive match would keep "matching" - and
  // re-writing - its own already-replaced output on every single poll.
  // Checking for the fullscreen icon too is what tells an already-handled
  // element apart from a fresh one still showing Google's original wording.
  function isUnhandled(el) {
    return el.textContent && el.textContent.indexOf('two fingers') !== -1 && el.textContent.indexOf('⛶') === -1;
  }
  function scan(root) {
    const matches = [];
    if (isUnhandled(root)) matches.push(root);
    if (root.querySelectorAll) {
      root.querySelectorAll('*').forEach(function(el) {
        if (isUnhandled(el)) matches.push(el);
      });
    }
    // Only rewrite the innermost matching element(s) - if the text is
    // wrapped in nested spans, every ancestor "matches" too via
    // textContent, but only the deepest one should actually get replaced.
    matches.forEach(function(el) {
      const hasMatchingDescendant = matches.some(function(other) { return other !== el && el.contains(other); });
      if (!hasMatchingDescendant) {
        el.innerHTML = 'Use two fingers to move map or<br>switch to full screen ⛶';
      }
    });
  }
  // No requestAnimationFrame here on purpose - a first version routed the
  // scan through one, meant to coalesce a burst of unrelated map-internal
  // mutations into a single pass, but rAF callbacks only run when the page
  // is actually being rendered, and can be delayed well beyond a single
  // frame otherwise - confirmed directly, a raw MutationObserver fired
  // right away in the same situation where the rAF-wrapped version never
  // fired at all. A MutationObserver callback already receives every
  // mutation from one batch together as a single call, which is enough
  // coalescing on its own without adding a second, less reliable layer of it.
  const mapEl = document.getElementById('map');
  scan(mapEl);
  new MutationObserver(function() { scan(mapEl); }).observe(mapEl, {
    childList: true, subtree: true, attributes: true, characterData: true,
  });
}

function starString(rating) {
  if (!rating) return 'No rating';
  const rounded = Math.round(rating);
  return '★'.repeat(rounded) + '☆'.repeat(5 - rounded) + ' (' + rating + ')';
}

function categoryTagHtml(p) {
  const meta = categoryMeta[p.category] || categoryMeta['other'];
  return '<div class="category-tag" style="color:' + meta.color + '">' + meta.label + '</div>';
}

function extraCategoryKeys(p) {
  return (p.extra_categories || '').split('; ').filter(Boolean);
}

function extraCategoryLabels(p) {
  return extraCategoryKeys(p).map(function(key) {
    return (categoryMeta[key] || categoryMeta['other']).label;
  }).join(', ');
}

// Shared by every template (Google's own marker icon AND, via an <img> tag,
// Esri's divIcon) so there's exactly one place that draws a pin - two
// templates each keeping their own copy of this drifted out of sync once
// before (the "everything shows as Other" bug), hence this being here now.
function markerIconUrl(p) {
  const meta = categoryMeta[p.category] || categoryMeta['other'];
  const extraKeys = extraCategoryKeys(p);
  const ringColor = extraKeys.length ? (categoryMeta[extraKeys[0]] || categoryMeta['other']).color : null;

  let svg = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36">';
  if (ringColor) {
    // A secondary type (e.g. a pumpkin patch that also has a corn maze) gets
    // a colored ring in that type's color, visible on the pin itself.
    svg += '<circle cx="18" cy="18" r="16.5" fill="none" stroke="' + ringColor + '" stroke-width="2.5"/>' +
      '<circle cx="18" cy="18" r="12.5" fill="' + meta.color + '" stroke="' + meta.strokeColor + '" stroke-width="1.5"/>' +
      '<text x="18" y="23" font-size="14" font-weight="bold" font-family="Arial" fill="' + meta.strokeColor + '" text-anchor="middle">' + meta.letter + '</text>';
  } else {
    svg += '<circle cx="18" cy="18" r="16" fill="' + meta.color + '" stroke="' + meta.strokeColor + '" stroke-width="2"/>' +
      '<text x="18" y="24" font-size="18" font-weight="bold" font-family="Arial" fill="' + meta.strokeColor + '" text-anchor="middle">' + meta.letter + '</text>';
  }
  svg += '</svg>';
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function makeMarkerContent(p) {
  const img = document.createElement('img');
  img.src = markerIconUrl(p);
  img.width = 36;
  img.height = 36;
  img.style.touchAction = 'pan-y';
  return img;
}

// A minimal custom marker built on OverlayView - Google's older, lower-level
// API for putting your own DOM element on the map - instead of either the
// classic (deprecated) Marker class or its newer replacement,
// AdvancedMarkerElement. Both of those were tried first: classic Marker's
// icon is an <img> tag with no supported way to reach it, and it does its
// own internal touch/gesture handling that calls preventDefault()
// regardless of any CSS, which is exactly what broke a single-finger swipe
// that happened to start on a pin. AdvancedMarkerElement fixes that (it
// takes a real DOM element you supply, with ordinary browser touch
// behavior) but requires a Map ID - and Google's API silently discards our
// own MAP_STYLE JSON the moment ANY Map ID is present, replacing it with
// Cloud Console's default styling, confirmed directly while testing this.
// That would have thrown away real, deliberate design work, so this
// smaller, lower-level API - full control over the marker's own element,
// no Map ID needed at all - is the one actually in use.
function PinMarker(position, map, content) {
  this.position = position;
  this.content = content;
  this.content.style.position = 'absolute';
  this.content.style.transform = 'translate(-50%, -50%)';
  this.setMap(map);
}

// google.maps.OverlayView doesn't exist yet when this script itself first
// runs - the Maps API loads async and only calls initMap() once it's ready
// - so PinMarker can't extend it at the top level like a normal class.
// Call this once, as the very first thing initMap() does, to wire up the
// prototype chain right after Maps has actually loaded but strictly before
// any "new PinMarker(...)" call - reassigning PinMarker.prototype only
// takes effect for instances created after the reassignment, so this can't
// be left until the first marker is constructed the way a lazier check
// might suggest; it has to run first, on its own.
function setupPinMarkerClass() {
  if (PinMarker.prototype.draw) return;
  PinMarker.prototype = Object.create(google.maps.OverlayView.prototype);
  PinMarker.prototype.onAdd = function() {
    this.getPanes().overlayMouseTarget.appendChild(this.content);
  };
  PinMarker.prototype.draw = function() {
    const projection = this.getProjection();
    if (!projection) return;
    const point = projection.fromLatLngToDivPixel(new google.maps.LatLng(this.position.lat, this.position.lng));
    this.content.style.left = point.x + 'px';
    this.content.style.top = point.y + 'px';
  };
  PinMarker.prototype.onRemove = function() {
    if (this.content.parentNode) this.content.parentNode.removeChild(this.content);
  };
}

// Touches on the popup never reach the map, so the popup handles its own:
// one finger drags the map (moveCamera, not panBy, so it tracks the finger
// with no easing), two fingers enlarge just the popup for reading. The CSS
// scale property is used because Google already sets transform on this
// element to position it; transform-origin 0 0 is the pin tip.
function enablePopupGestures(infoWindow, map) {
  const projectionHelper = new google.maps.OverlayView();
  projectionHelper.onAdd = function() {};
  projectionHelper.draw = function() {};
  projectionHelper.onRemove = function() {};
  projectionHelper.setMap(map);

  infoWindow.addListener('domready', function() {
    const content = document.querySelector('.popup-content');
    const bubble = content && content.closest('.gm-style-iw-c');
    if (!bubble) return;
    bubble.style.scale = '';
    bubble.style.transformOrigin = '0 0';
    bubble.style.touchAction = 'none';
    if (bubble.dataset.gesturesAttached) return;
    bubble.dataset.gesturesAttached = 'true';

    let lastX = 0, lastY = 0, pinchStartDist = 0, pinchStartScale = 1;
    function distance(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
    function reset(e) {
      if (e.touches.length === 1) {
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else if (e.touches.length >= 2) {
        pinchStartDist = distance(e.touches);
        pinchStartScale = parseFloat(bubble.style.scale) || 1;
      }
    }
    bubble.addEventListener('touchstart', reset, { passive: true });
    bubble.addEventListener('touchend', reset, { passive: true });
    bubble.addEventListener('touchcancel', reset, { passive: true });
    bubble.addEventListener('touchmove', function(e) {
      if (e.touches.length >= 2) {
        if (pinchStartDist > 0) {
          const scale = Math.min(3, Math.max(1, pinchStartScale * distance(e.touches) / pinchStartDist));
          bubble.style.scale = String(scale);
        }
        return;
      }
      const projection = projectionHelper.getProjection();
      if (!projection || e.touches.length !== 1) return;
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      const c = projection.fromLatLngToDivPixel(map.getCenter());
      map.moveCamera({ center: projection.fromDivPixelToLatLng(new google.maps.Point(c.x + lastX - x, c.y + lastY - y)) });
      lastX = x;
      lastY = y;
    }, { passive: true });
  });
}

function popupHtml(p) {
  let html = '<div class="popup-content">';
  if (p.photo) html += '<img src="' + p.photo + '" alt="' + p.name + '">';
  html += categoryTagHtml(p);
  html += '<h3>' + p.name + '</h3>';
  if (p.extra_categories) html += '<div class="field"><span class="label">Also:</span> ' + extraCategoryLabels(p) + '</div>';
  html += '<div class="field">' + starString(p.rating) + (p.rating_count ? ' - ' + p.rating_count + ' reviews' : '') + '</div>';
  html += '<div class="field">' + p.address + '</div>';
  if (p.admission_price) html += '<div class="field"><span class="label">Price:</span> ' + p.admission_price + '</div>';
  if (p.activities) html += '<div class="field"><span class="label">Activities:</span> ' + p.activities + '</div>';
  if (p.season_dates) html += '<div class="field"><span class="label">Season:</span> ' + p.season_dates + '</div>';
  if (p.website) html += '<div class="field"><a href="' + p.website + '" target="_blank" rel="noopener">Visit website</a></div>';
  html += '<div class="field"><a href="' + p.google_maps_url + '" target="_blank" rel="noopener">Open in Google Maps</a></div>';
  html += '</div>';
  return html;
}

function toPoint(r, slug) {
  const photoPaths = (r.photo_paths || '').split('; ').filter(Boolean);
  const photo = photoPaths.length ? (slug + '/photos/' + photoPaths[0]) : '';
  return {
    name: r.name || '', category: r.category || 'other', address: r.address || '',
    latitude: r.latitude, longitude: r.longitude, rating: r.rating || '',
    rating_count: r.rating_count || '', admission_price: r.admission_price || '',
    activities: r.activities || '', season_dates: r.season_dates || '',
    website: r.website || '', google_maps_url: r.google_maps_url || '',
    needs_verification: r.needs_verification || '', extra_categories: r.extra_categories || '',
    photo: photo,
  };
}

let map;
let currentMarkers = [];
let hoverInfo;
let clickInfo;
const HAS_MOUSE = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

function clearMarkers() {
  currentMarkers.forEach(function(m) { m.setMap(null); });
  currentMarkers = [];
  hoverInfo.close();
  clickInfo.close();
}

function loadRegion(slug) {
  clearMarkers();
  fetch(slug + '/patches.json', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(records) {
      const points = records.filter(function(r) { return r.latitude && r.longitude; })
                             .map(function(r) { return toPoint(r, slug); });
      const bounds = new google.maps.LatLngBounds();

      points.forEach(function(p) {
        const position = { lat: p.latitude, lng: p.longitude };
        const marker = new PinMarker(position, map, makeMarkerContent(p));
        currentMarkers.push(marker);
        bounds.extend(position);

        // Hover box only with a real mouse: iOS Safari turns a first tap into
        // a mouseover, which showed this small box and needed a second tap
        // for the full popup.
        if (HAS_MOUSE) {
          marker.content.addEventListener('mouseover', function() {
            hoverInfo.setContent(
              '<div class="hover-content">' + categoryTagHtml(p) +
              '<strong>' + p.name + '</strong><br>' + starString(p.rating) + '</div>'
            );
            hoverInfo.setPosition(position);
            hoverInfo.open(map);
          });
          marker.content.addEventListener('mouseout', function() { hoverInfo.close(); });
        }
        marker.content.addEventListener('click', function() {
          hoverInfo.close();
          clickInfo.setContent(popupHtml(p));
          clickInfo.setPosition(position);
          clickInfo.open(map);
        });
      });

      if (!bounds.isEmpty()) map.fitBounds(bounds);

      try { localStorage.setItem('pumpkinMapRegion', slug); } catch (e) {}
    });
}

function initMap() {
  setupPinMarkerClass();
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 39.5, lng: -121.5 },
    zoom: 5,
    styles: mapStyle,
    colorScheme: google.maps.ColorScheme.DARK,
    zoomControl: false,
    fullscreenControl: false,
    mapTypeControl: false,
    streetViewControl: false,
    rotateControl: false,
    cameraControl: false,
    gestureHandling: 'cooperative',
  });
  addCustomControls(map);
  redirectGestureHintToFullscreen();

  hoverInfo = new google.maps.InfoWindow();
  clickInfo = new google.maps.InfoWindow();
  enablePopupGestures(clickInfo, map);
  hoverInfo.addListener('domready', function() {
    const content = document.querySelector('.hover-content');
    const wrapper = content && content.closest('.gm-style-iw');
    const closeBtn = wrapper && wrapper.parentElement && wrapper.parentElement.querySelector('.gm-ui-hover-effect');
    if (closeBtn) closeBtn.style.display = 'none';
  });

  // Region names end in ", XX" (state code); the state picker filters the
  // region picker to that state, keeping regions.json's own order.
  const STATE_NAMES = { WA: 'Washington', OR: 'Oregon', CA: 'California', ID: 'Idaho', AZ: 'Arizona', NV: 'Nevada', UT: 'Utah', CO: 'Colorado', NM: 'New Mexico', TX: 'Texas', MT: 'Montana', WY: 'Wyoming', OK: 'Oklahoma', KS: 'Kansas', NE: 'Nebraska', SD: 'South Dakota', ND: 'North Dakota', MN: 'Minnesota', IA: 'Iowa' };
  const stateOf = function(r) { return r.name.slice(-2); };
  const regionLabel = function(r) { return r.name.replace(/, [A-Z]{2}$/, ''); };
  const statePicker = document.getElementById('state-picker');
  const picker = document.getElementById('region-picker');
  const states = [];
  REGIONS.forEach(function(r) { if (states.indexOf(stateOf(r)) === -1) states.push(stateOf(r)); });
  states.forEach(function(s) {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = STATE_NAMES[s] || s;
    statePicker.appendChild(opt);
  });
  function fillRegions(state) {
    picker.innerHTML = '';
    REGIONS.filter(function(r) { return stateOf(r) === state; }).forEach(function(r) {
      const opt = document.createElement('option');
      opt.value = r.slug;
      opt.textContent = regionLabel(r);
      picker.appendChild(opt);
    });
  }
  statePicker.addEventListener('change', function() {
    fillRegions(statePicker.value);
    loadRegion(picker.value);
  });

  // A region page on the Wix site embeds the map as index.html?region=<slug>
  // so it opens on that region; otherwise reopen the visitor's last pick.
  const isRegion = function(slug) { return REGIONS.some(function(r) { return r.slug === slug; }); };
  let startSlug = REGIONS.length ? REGIONS[0].slug : null;
  const requested = new URLSearchParams(window.location.search).get('region');
  if (isRegion(requested)) {
    startSlug = requested;
  } else {
    try {
      const saved = localStorage.getItem('pumpkinMapRegion');
      if (isRegion(saved)) startSlug = saved;
    } catch (e) {}
  }

  if (startSlug) {
    const startState = stateOf(REGIONS.find(function(r) { return r.slug === startSlug; }));
    statePicker.value = startState;
    fillRegions(startState);
    picker.value = startSlug;
    loadRegion(startSlug);
  }

  picker.addEventListener('change', function() { loadRegion(picker.value); });

  const legend = document.getElementById('legend');
  let rows = '';
  for (const key in categoryMeta) {
    const m = categoryMeta[key];
    rows += '<span class="legend-dot" style="background:' + m.color + ';"></span>' + m.label + '<br>';
  }
  legend.innerHTML = rows;
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBQ4kQM8Jxe2HxX-6reOfDrV5SBac1nMFk&callback=initMap" async defer></script>
</body>
