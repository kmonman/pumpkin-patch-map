function starString(rating) {
  if (!rating) return 'No rating';
  const rounded = Math.round(rating);
  return '★'.repeat(rounded) + '☆'.repeat(5 - rounded) + ' (' + rating + ')';
}

function categoryTagHtml(p) {
  const meta = categoryMeta[p.category] || categoryMeta['other'];
  return '<div class="category-tag" style="color:' + meta.color + '">' + meta.label + '</div>';
}

function popupHtml(p) {
  let html = '<div class="popup-content">';
  if (p.photo) html += '<img src="' + p.photo + '" alt="' + p.name + '">';
  html += categoryTagHtml(p);
  html += '<h3>' + p.name + '</h3>';
  html += '<div class="field">' + starString(p.rating) + (p.rating_count ? ' - ' + p.rating_count + ' reviews' : '') + '</div>';
  html += '<div class="field">' + p.address + '</div>';
  if (p.admission_price) html += '<div class="field"><span class="label">Price:</span> ' + p.admission_price + '</div>';
  if (p.activities) html += '<div class="field"><span class="label">Activities:</span> ' + p.activities + '</div>';
  if (p.season_dates) html += '<div class="field"><span class="label">Season:</span> ' + p.season_dates + '</div>';
  if (p.website) html += '<div class="field"><a href="' + p.website + '" target="_blank" rel="noopener">Visit website</a></div>';
  html += '<div class="field"><a href="' + p.google_maps_url + '" target="_blank" rel="noopener">Open in Google Maps</a></div>';
  if (p.needs_verification) html += '<div class="flag">Note: ' + p.needs_verification + '</div>';
  html += '</div>';
  return html;
}

function markerIconUrl(category) {
  const meta = categoryMeta[category] || categoryMeta['other'];
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36">' +
    '<circle cx="18" cy="18" r="16" fill="' + meta.color + '" stroke="white" stroke-width="2"/>' +
    '<text x="18" y="24" font-size="16" text-anchor="middle">' + meta.emoji + '</text></svg>';
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function initMap() {
  const map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 47.51943512982456, lng: -122.29440293859649 },
    zoom: 9,
    styles: mapStyle,
  });

  const hoverInfo = new google.maps.InfoWindow();
  const clickInfo = new google.maps.InfoWindow();

  // Hover is meant to be a quick glance, not something you dismiss by hand -
  // it already closes itself on mouseout, so hide the close (x) button Google
  // adds by default. (Relies on Google's current internal class name for that
  // button, which has been stable for a long time but isn't officially
  // documented - if a future Maps version renames it, worst case the x
  // button just reappears, nothing breaks.)
  hoverInfo.addListener('domready', function() {
    // Scope to the hover box specifically (by its unique .hover-content
    // child) rather than grabbing the first close button in the document,
    // in case a click popup happens to be open on another marker at the
    // same time.
    const content = document.querySelector('.hover-content');
    const wrapper = content && content.closest('.gm-style-iw');
    const closeBtn = wrapper && wrapper.parentElement && wrapper.parentElement.querySelector('.gm-ui-hover-effect');
    if (closeBtn) closeBtn.style.display = 'none';
  });

  patches.forEach(function(p) {
    if (!p.latitude || !p.longitude) return;

    const marker = new google.maps.Marker({
      position: { lat: p.latitude, lng: p.longitude },
      map: map,
      icon: { url: markerIconUrl(p.category), scaledSize: new google.maps.Size(36, 36) },
    });

    marker.addListener('mouseover', function() {
      hoverInfo.setContent(
        '<div class="hover-content">' + categoryTagHtml(p) +
        '<strong>' + p.name + '</strong><br>' + starString(p.rating) + '</div>'
      );
      hoverInfo.open(map, marker);
    });
    marker.addListener('mouseout', function() {
      hoverInfo.close();
    });
    marker.addListener('click', function() {
      hoverInfo.close();
      clickInfo.setContent(popupHtml(p));
      clickInfo.open(map, marker);
    });
  });

  const legend = document.getElementById('legend');
  let rows = '';
  for (const key in categoryMeta) {
    rows += categoryMeta[key].emoji + ' ' + categoryMeta[key].label + '<br>';
  }
  legend.innerHTML = rows;
}
